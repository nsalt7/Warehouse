<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hypertrophy">
  <title>Hypertrophy Coach</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='12' width='4' height='8' rx='1.5' fill='%23007aff'/%3E%3Crect x='7' y='9' width='4' height='14' rx='1.5' fill='%23007aff'/%3E%3Crect x='12' y='14.5' width='8' height='3' rx='1.5' fill='%23007aff'/%3E%3Crect x='21' y='9' width='4' height='14' rx='1.5' fill='%23007aff'/%3E%3Crect x='26' y='12' width='4' height='8' rx='1.5' fill='%23007aff'/%3E%3C/svg%3E">
</head>
<body>
  <main id="app" class="container"></main>

  <nav class="tabbar">
    <a href="#/" data-testid="nav-home" aria-label="Train">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>
      </svg>
      Train
    </a>
    <a href="#/history" data-testid="nav-history" aria-label="History">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 14l4-4 3 3 5-6"/>
      </svg>
      History
    </a>
    <a href="#/new" data-testid="nav-new" aria-label="Plan">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
      </svg>
      Plan
    </a>
    <button id="nav-data" data-testid="nav-data" aria-label="Data & profile">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.07-.4.1-.8.1-1.2Z"/>
      </svg>
      Data
    </button>
  </nav>

  <div id="modal-root"></div>
  <div id="rest-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="import-file" accept="application/json" class="hidden">
  <script type="module" src="./app.js"></script>
</body>
</html>
